name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci: rolldown (pulled in by vitest) declares optional wasm
      # bindings whose transitive deps npm records in the lockfile inconsistently across
      # OS/npm versions, so the strict `npm ci` sync check fails on the Linux runner even
      # when the lockfile installs cleanly locally. `npm install` reconciles and installs.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tg-relay-bot:ci .
      # Placeholder values, not secrets: booting, opening SQLite and answering /healthz
      # all happen before the container ever talks to Telegram. Waiting on the image's
      # own HEALTHCHECK is what puts src/server.ts and that directive under the gate.
      - name: Image boots and reports healthy
        run: |
          docker run -d --name ci-probe \
            -e ENV_MANAGER_BOT_TOKEN=123456:ci-placeholder \
            -e ENV_HOST_UID=1 \
            -e ENV_MASTER_ENC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e ENV_PUBLIC_BASE_URL=https://ci.invalid \
            tg-relay-bot:ci
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ci-probe)
            case "$status" in
              healthy) echo "container is healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            [ "$(docker inspect -f '{{.State.Running}}' ci-probe)" = true ] || break
            sleep 2
          done
          echo "container never became healthy (last status: $status)"
          docker logs ci-probe
          exit 1
